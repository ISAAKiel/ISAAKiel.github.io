
name: Build and deploy ISAAKiel website

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: rocker/verse:4.5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify R environment
        run: |
          Rscript -e 'stopifnot(all(
            vapply(
              c("rmarkdown", "knitr", "httr", "htmltools"),
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ))'
          Rscript -e 'print(R.version.string)'
          pandoc --version

      - name: Render website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Rscript -e 'rmarkdown::render_site(".")'

      - name: Verify generated pages
        run: |
          test -s index.html
          test -s projects.html
          test -s events.html

      # Keep a regular artifact for inspecting
      # the rendered website in pull requests.
      - name: Upload rendered website
        uses: actions/upload-artifact@v4
        with:
          name: isaakiel-website
          path: |
            *.html
            *.css
            site_libs/
            images/
            figures/
            assets/
            elements/header_bg_2.jpg
            .nojekyll
          if-no-files-found: warn

      # Assemble a clean directory containing only
      # the rendered website and required static assets.
      - name: Prepare Pages directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site_publish

          # Rendered HTML pages
          cp index.html projects.html events.html _site_publish/

          # Stylesheets and root-level static files
          for file in *.css *.js *.png *.jpg *.jpeg *.svg *.gif *.ico *.webp; do
            if [ -f "$file" ]; then
              cp "$file" _site_publish/
            fi
          done

          # Static resource directories
          for dir in site_libs images img figures assets css js fonts media; do
            if [ -d "$dir" ]; then
              cp -R "$dir" _site_publish/
            fi
          done

          # Hero background image
          mkdir -p _site_publish/elements
          cp elements/header_bg_2.jpg _site_publish/elements/

          # Optional custom domain
          if [ -f CNAME ]; then
            cp CNAME _site_publish/
          fi

          # Disable Jekyll processing
          touch _site_publish/.nojekyll

          # Verify generated pages and hero image
          test -s _site_publish/index.html
          test -s _site_publish/projects.html
          test -s _site_publish/events.html
          test -s _site_publish/elements/header_bg_2.jpg

          echo "Prepared website files:"
          find _site_publish -type f | sort

      # Artifact used by the GitHub Pages deployment job
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_publish

  deploy:
    name: Deploy to GitHub Pages

    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
